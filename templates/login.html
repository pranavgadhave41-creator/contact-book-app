<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container auth-container">
    <h1>📇 Contact Book</h1>
    <p class="subtitle" style="text-align:center;">Log in to your account</p>

    <div class="card">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <p style="color:#ef4444; text-align:center; margin-top:0;">{{ messages[0] }}</p>
        {% endif %}
      {% endwith %}

      <form class="add-form" action="/login" method="POST" style="flex-direction: column;">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log In</button>
      </form>
    </div>

    <p style="text-align:center;">Don't have an account? <a href="/signup" style="color:#6366f1;">Sign up</a></p>
  </div>
</body>
</html>
