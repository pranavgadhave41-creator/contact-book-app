<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>📇 Contact Book</h1>
    <p class="subtitle">Create your account</p>

    <div class="card">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <p style="color:#ef4444; text-align:center; margin-top:0;">{{ messages[0] }}</p>
        {% endif %}
      {% endwith %}

      <form class="add-form" action="/signup" method="POST" style="flex-direction: column;">
        <input type="text" name="username" placeholder="Choose a username" required>
        <input type="password" name="password" placeholder="Choose a password" required>
        <button type="submit">Sign Up</button>
      </form>
    </div>

    <p style="text-align:center;">Already have an account? <a href="/login" style="color:#6366f1;">Log in</a></p>
  </div>
</body>
</html>
