<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Contact</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <h1>Edit Contact</h1>

  <form action="/update/{{ contact[0] }}" method="POST">
    <input type="text" name="name" value="{{ contact[1] }}" required>
    <input type="text" name="phone" value="{{ contact[2] }}">
    <input type="email" name="email" value="{{ contact[3] }}">
    <button type="submit">Save Changes</button>
  </form>

  <a href="/">Back to Contact Book</a>

</body>
</html>
